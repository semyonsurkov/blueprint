<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проект</title>
<link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/index.css">
<link rel="stylesheet" href="./blueprint.css">
<script>
let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { theme = localStorage.getItem("blueprint_theme") || theme; } catch {}
document.documentElement.dataset.theme = theme;
</script>
<script>window.EXCALIDRAW_ASSET_PATH = "https://esm.sh/@excalidraw/excalidraw@0.18.1/dist/prod/";</script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.3.0",
    "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.3.0",
    "react-dom/client": "https://esm.sh/react-dom@19.3.0/client",
    "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw@0.18.1?external=react,react-dom",
    "marked": "https://esm.sh/marked@18.0.14"
  }
}
</script>
</head>
<body>
<header class="top">
  <strong id="title"><i class="sk sk_title"></i></strong>
  <nav id="tabs"><i class="sk sk_tab"></i><i class="sk sk_tab"></i><i class="sk sk_tab"></i></nav>
  <div id="actions">
    <span id="status"></span>
    <button id="theme_toggle" type="button" aria-label="Сменить тему">
      <svg class="icon_sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon_moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <i id="docs_slot" class="sk sk_button"></i>
  </div>
</header>
<main id="view"><div class="sk_page sk_canvas"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></div></main>
<script>
try {
  const shell = JSON.parse(localStorage.getItem("blueprint_shell") || "null");
  if (shell) {
    const id = location.hash.slice(1);
    const tab = shell.tabs.find((item) => item.id === id) ?? shell.tabs[0];
    document.getElementById("title").textContent = shell.title;
    const nav = document.getElementById("tabs");
    nav.replaceChildren(...shell.tabs.map((item) => {
      const link = document.createElement("a");
      link.href = "#" + item.id;
      link.textContent = item.title;
      if (item === tab) link.setAttribute("aria-current", "page");
      return link;
    }));
    const slot = document.getElementById("docs_slot");
    if (tab.docsLabel) {
      const button = document.createElement("button");
      button.id = "docs_toggle";
      button.textContent = tab.docsLabel;
      slot.replaceWith(button);
    } else slot.remove();
    if (tab.kind === "markdown") {
      const page = document.getElementById("view").firstElementChild;
      page.className = "sk_page sk_text";
      page.innerHTML = '<i class="sk sk_heading"></i><i class="sk"></i><i class="sk"></i><i class="sk sk_short"></i><i class="sk"></i><i class="sk"></i><i class="sk sk_short"></i>';
    }
  }
} catch {}
</script>
<script type="module" src="./blueprint.js"></script>
</body>
</html>
