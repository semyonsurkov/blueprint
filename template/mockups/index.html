<!doctype html>
<meta charset="utf-8">
<title>Каркасы</title>
<link rel="stylesheet" href="wire.css">
<style>
html, body { margin: 0; background: #e6e6e6; font-family: system-ui; }
#space { position: relative; }
#board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.item { position: absolute; border: 1px solid #bbb; background: #fff; }
.caption { position: absolute; top: -28px; font-size: 14px; color: #444; white-space: nowrap; text-decoration: none; }
.caption:hover { color: #000; text-decoration: underline; }
.group { position: absolute; font-size: 64px; font-weight: 700; color: #222; white-space: nowrap; }
</style>
<div id="space"><div id="board"></div></div>
<script type="module">
const WIDE_COLUMNS = 3;
const NARROW_COLUMNS = 7;
const WIDE_FROM = 1000;
const GAP = 80;
const GROUP_TITLE_H = 200;
const PAD_X = 40;
const PAD_Y = 140;
const MIN_SCALE = 0.08;
const MAX_SCALE = 2;
const DEFAULT_SCALE = 0.28;
const VIEW_KEY = "mockups_view";
const space = document.getElementById("space");
const board = document.getElementById("board");
const pending = [];
const saved = JSON.parse(sessionStorage.getItem(VIEW_KEY) ?? "null");
let scale = saved?.scale ?? DEFAULT_SCALE;
const content = { width: 0, height: 0 };

const apply = () => {
  board.style.transform = `scale(${scale})`;
  board.style.left = `${PAD_X}px`;
  board.style.top = `${PAD_Y}px`;
  space.style.width = `${PAD_X * 2 + content.width * scale}px`;
  space.style.height = `${PAD_Y + PAD_X + content.height * scale}px`;
};
const remember = () => sessionStorage.setItem(VIEW_KEY, JSON.stringify({ scale, scrollX, scrollY }));

const loadScreen = async (holder, file) => {
  const html = new DOMParser().parseFromString(await (await fetch(file)).text(), "text/html");
  holder.append(html.body.firstElementChild);
};

const { screens } = await (await fetch("screens.json")).json();
const groups = Map.groupBy(screens, (screen) => screen.group);
let top = 0;
for (const [name, list] of groups) {
  board.insertAdjacentHTML("beforeend", `<div class="group" style="left:0;top:${top}px">${name}</div>`);
  top += GROUP_TITLE_H;
  let column = 0, left = 0, rowHeight = 0;
  for (const screen of list) {
    const [width, height] = screen.size;
    if (column === (width > WIDE_FROM ? WIDE_COLUMNS : NARROW_COLUMNS)) { column = 0; left = 0; top += rowHeight + GAP; rowHeight = 0; }
    const holder = document.createElement("div");
    holder.className = "item";
    holder.id = `screen_${screen.file.replace(".html", "")}`;
    holder.style.cssText = `left:${left}px;top:${top}px;width:${width}px;height:${height}px`;
    holder.innerHTML = `<a class="caption" href="${screen.file}?annotate">${screen.title}</a>`;
    board.append(holder);
    pending.push(loadScreen(holder, screen.file));
    left += width + GAP;
    content.width = Math.max(content.width, left);
    rowHeight = Math.max(rowHeight, height);
    column++;
  }
  top += rowHeight + GAP * 2;
}
content.height = top;
apply();
if (saved) scrollTo(saved.scrollX, saved.scrollY);
await Promise.all(pending);
window.WIRE_ANNOTATE = true;
await import("./wire.js");

addEventListener("scroll", remember);
addEventListener("wheel", (event) => {
  if (!(event.ctrlKey || event.metaKey)) return;
  event.preventDefault();
  const anchorX = (scrollX + event.clientX - PAD_X) / scale;
  const anchorY = (scrollY + event.clientY - PAD_Y) / scale;
  scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * Math.exp(-event.deltaY * 0.01)));
  apply();
  scrollTo(PAD_X + anchorX * scale - event.clientX, PAD_Y + anchorY * scale - event.clientY);
  remember();
}, { passive: false });
</script>
