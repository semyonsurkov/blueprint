<!doctype html>
<meta charset="utf-8">
<title>Каркасы</title>
<style>
html, body { margin: 0; height: 100%; background: #e6e6e6; overflow: hidden; font-family: system-ui; }
#board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.item { position: absolute; }
.caption { position: absolute; top: -28px; font-size: 14px; color: #444; white-space: nowrap; }
.group { position: absolute; font-size: 64px; font-weight: 700; color: #222; white-space: nowrap; }
iframe { border: 1px solid #bbb; background: #fff; display: block; pointer-events: none; }
body.picking { cursor: crosshair; }
#highlight { position: absolute; pointer-events: none; outline: solid #2563eb; background: rgba(37, 99, 235, 0.12); display: none; }
#toolbar { position: fixed; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; z-index: 5; }
#toolbar button { font: inherit; font-size: 13px; padding: 7px 12px; border: 1px solid #999; border-radius: 8px; background: #fff; cursor: pointer; }
#toolbar button[aria-pressed="true"] { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
#hint { font-size: 13px; color: #555; }
#result { position: fixed; left: 12px; right: 12px; bottom: 56px; max-height: 40vh; overflow: auto; margin: 0; padding: 12px 14px; background: #1a1a1a; color: #f3f3f3; border-radius: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; z-index: 5; display: none; }
</style>
<div id="board"><div id="highlight"></div></div>
<div id="toolbar">
  <button id="pick" aria-pressed="false">Выбрать элемент</button>
  <span id="hint"></span>
</div>
<pre id="result"></pre>
<script type="module">
const WIDE_COLUMNS = 3;
const NARROW_COLUMNS = 7;
const WIDE_FROM = 1000;
const GAP = 80;
const GROUP_TITLE_H = 200;
const MAX_HTML_CHARS = 240;
const MAX_TEXT_CHARS = 80;
const board = document.getElementById("board");
const highlight = document.getElementById("highlight");
const pickButton = document.getElementById("pick");
const hint = document.getElementById("hint");
const result = document.getElementById("result");
const items = [];
let scale = 0.28, x = 40, y = 140;
let picking = false;
const apply = () => { board.style.transform = `translate(${x}px, ${y}px) scale(${scale})`; };

const { screens } = await (await fetch("screens.json")).json();
const groups = Map.groupBy(screens, (screen) => screen.group);
let top = 0;
for (const [name, list] of groups) {
  board.insertAdjacentHTML("beforeend", `<div class="group" style="left:0;top:${top}px">${name}</div>`);
  top += GROUP_TITLE_H;
  let column = 0, left = 0, rowHeight = 0;
  for (const screen of list) {
    const [width, height] = screen.size;
    if (column === (width > WIDE_FROM ? WIDE_COLUMNS : NARROW_COLUMNS)) { column = 0; left = 0; top += rowHeight + GAP; rowHeight = 0; }
    const holder = document.createElement("div");
    holder.className = "item";
    holder.style.cssText = `left:${left}px;top:${top}px`;
    holder.innerHTML = `<div class="caption">${screen.title}</div><iframe src="${screen.file}" style="width:${width}px;height:${height}px" scrolling="no"></iframe>`;
    board.append(holder);
    items.push({ left, top, width, height, frame: holder.querySelector("iframe"), screen });
    left += width + GAP;
    rowHeight = Math.max(rowHeight, height);
    column++;
  }
  top += rowHeight + GAP * 2;
}
apply();

const elementAt = (clientX, clientY) => {
  const bx = (clientX - x) / scale, by = (clientY - y) / scale;
  const item = items.find((i) => bx >= i.left && bx <= i.left + i.width && by >= i.top && by <= i.top + i.height);
  if (!item) return null;
  const doc = item.frame.contentDocument;
  const element = doc?.elementFromPoint(bx - item.left - 1, by - item.top - 1);
  return element && element !== doc.body && element !== doc.documentElement ? { item, element } : null;
};

const describe = ({ item, element }) => {
  const doc = item.frame.contentDocument;
  const root = doc.body.firstElementChild;
  const name = (node) => {
    const classes = [...node.classList].map((c) => `.${c}`).join("");
    const same = [...node.parentElement.children].filter((c) => c.tagName === node.tagName);
    const nth = same.length > 1 ? `:nth-of-type(${same.indexOf(node) + 1})` : "";
    return `${node.tagName.toLowerCase()}${classes}${nth}`;
  };
  const path = [];
  for (let node = element; node && node !== root.parentElement; node = node.parentElement) path.unshift(name(node));
  const text = element.textContent.trim().replace(/\s+/g, " ").slice(0, MAX_TEXT_CHARS);
  const shell = element.closest("[data-wire]");
  const copy = element.closest("[data-copy]");
  const lines = [
    `Макет: design/mockups/${item.screen.file} (${item.screen.title})`,
    `Элемент: ${path.join(" > ")}`,
  ];
  if (text) lines.push(`Текст: «${text}»`);
  if (shell) lines.push(`Внутри общего блока ${shell.dataset.wire}: его разметка живёт в wire.js, правка меняет все экраны`);
  if (copy) lines.push(`Повторяемый блок: копия ${copy.dataset.copy}, в файле он один с data-repeat, правка меняет все копии`);
  const html = element.outerHTML.replace(/\s+/g, " ");
  lines.push(`HTML: ${html.length > MAX_HTML_CHARS ? html.slice(0, MAX_HTML_CHARS) + "…" : html}`);
  lines.push("Что изменить: ");
  return lines.join("\n");
};

const copyText = async (text) => {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const area = document.createElement("textarea");
  area.value = text; document.body.append(area); area.select();
  const ok = document.execCommand("copy"); area.remove();
  return ok;
};

const setPicking = (on) => {
  picking = on;
  document.body.classList.toggle("picking", on);
  pickButton.setAttribute("aria-pressed", String(on));
  hint.textContent = on ? "Кликни по элементу, описание скопируется. Esc выход" : "";
  if (!on) highlight.style.display = "none";
};
pickButton.addEventListener("click", () => setPicking(!picking));
addEventListener("keydown", (event) => {
  if (event.key === "Escape") { setPicking(false); result.style.display = "none"; }
  else if (event.key === "p" && !event.metaKey && !event.ctrlKey) setPicking(!picking);
});

const showHighlight = (target) => {
  if (!target) { highlight.style.display = "none"; return; }
  const rect = target.element.getBoundingClientRect();
  highlight.style.cssText = `display:block;left:${target.item.left + 1 + rect.x}px;top:${target.item.top + 1 + rect.y}px;width:${rect.width}px;height:${rect.height}px;outline-width:${2 / scale}px`;
};

addEventListener("wheel", (event) => {
  event.preventDefault();
  if (event.ctrlKey || event.metaKey) {
    const factor = Math.exp(-event.deltaY * 0.01);
    const bx = (event.clientX - x) / scale, by = (event.clientY - y) / scale;
    scale = Math.min(2, Math.max(0.08, scale * factor));
    x = event.clientX - bx * scale;
    y = event.clientY - by * scale;
  } else { x -= event.deltaX; y -= event.deltaY; }
  apply();
  if (picking) showHighlight(null);
}, { passive: false });

const DRAG_THRESHOLD = 4;
let dragging = false, moved = 0, lastX, lastY;
addEventListener("mousedown", (event) => {
  if (event.target.closest("#toolbar, #result")) return;
  dragging = true; moved = 0; lastX = event.clientX; lastY = event.clientY;
});
addEventListener("mouseup", async (event) => {
  const wasClick = dragging && moved < DRAG_THRESHOLD;
  dragging = false;
  if (!wasClick || !picking) return;
  const target = elementAt(event.clientX, event.clientY);
  if (!target) return;
  const text = describe(target);
  result.textContent = text;
  result.style.display = "block";
  hint.textContent = (await copyText(text)) ? "Скопировано, допиши что изменить" : "Не удалось скопировать, выдели текст вручную";
});
addEventListener("mousemove", (event) => {
  if (dragging) {
    moved += Math.abs(event.clientX - lastX) + Math.abs(event.clientY - lastY);
    x += event.clientX - lastX; y += event.clientY - lastY;
    lastX = event.clientX; lastY = event.clientY;
    apply();
  } else if (picking) showHighlight(elementAt(event.clientX, event.clientY));
});
</script>
