<!doctype html>
<meta charset="utf-8">
<title>Каркасы</title>
<link rel="stylesheet" href="wire.css">
<style>
html {
  --board_bg: #e6e6e6;
  --board_item_bg: #ffffff;
  --board_item_line: #bbbbbb;
  --board_caption: #444444;
  --board_title: #222222;
  --board_panel: #ffffff;
  --board_panel_line: #c9c9c9;
  --board_hover: #f1f3f5;
  --board_text: #1a1a1a;
  --board_mute: #5c5c5c;
}
html[data-theme="dark"] {
  --board_bg: #111111;
  --board_item_bg: #161616;
  --board_item_line: #333333;
  --board_caption: #9a9a9a;
  --board_title: #ececec;
  --board_panel: #161616;
  --board_panel_line: #333333;
  --board_hover: #232323;
  --board_text: #ececec;
  --board_mute: #9a9a9a;
}
html, body { margin: 0; background: var(--board_bg); font-family: system-ui; }
html { scrollbar-width: none; }
html::-webkit-scrollbar { display: none; }
#space { position: relative; }
#board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.item { position: absolute; border: 1px solid var(--board_item_line); background: var(--board_item_bg); }
.caption { position: absolute; top: -28px; font-size: 14px; color: var(--board_caption); white-space: nowrap; text-decoration: none; }
.caption:hover { color: var(--board_text); text-decoration: underline; }
.group { position: absolute; font-size: 64px; font-weight: 700; color: var(--board_title); white-space: nowrap; }
.panning, .panning * { cursor: grab !important; user-select: none; }
.dragging, .dragging * { cursor: grabbing !important; }
.zoom { position: fixed; left: 16px; bottom: 16px; z-index: 1000; display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--board_panel_line); border-radius: 10px; background: var(--board_panel); font: 13px system-ui; }
.zoom button { min-width: 30px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--board_text); font: inherit; cursor: pointer; }
.zoom button:hover { background: var(--board_hover); }
.zoom output { min-width: 44px; text-align: center; color: var(--board_mute); }
</style>
<div id="space"><div id="board"></div></div>
<script type="module">
const WIDE_COLUMNS = 2;
const NARROW_COLUMNS = 7;
const WIDE_FROM = 1000;
const GAP = 80;
const GROUP_TITLE_H = 120;
const PAD_X = 40;
const PAD_Y = 40;
const MIN_SCALE = 0.08;
const MAX_SCALE = 2;
const FIT_MAX_SCALE = 0.6;
const VIEW_KEY = "mockups_view_v2";
const space = document.getElementById("space");
const board = document.getElementById("board");
const pending = [];
const saved = JSON.parse(sessionStorage.getItem(VIEW_KEY) ?? "null");
let scale = saved?.scale ?? MIN_SCALE;
const content = { width: 0, height: 0 };

const apply = () => {
  board.style.transform = `scale(${scale})`;
  board.style.left = `${PAD_X}px`;
  board.style.top = `${PAD_Y}px`;
  space.style.width = `${PAD_X * 2 + content.width * scale}px`;
  space.style.height = `${PAD_Y + PAD_X + content.height * scale}px`;
};
const remember = () => sessionStorage.setItem(VIEW_KEY, JSON.stringify({ scale, scrollX, scrollY }));

const loadScreen = async (holder, file) => {
  const html = new DOMParser().parseFromString(await (await fetch(file)).text(), "text/html");
  holder.append(html.body.firstElementChild);
};

const { screens } = await (await fetch("screens.json")).json();
const groups = Map.groupBy(screens, (screen) => screen.group);
let top = 0;
for (const [name, list] of groups) {
  board.insertAdjacentHTML("beforeend", `<div class="group" style="left:0;top:${top}px">${name}</div>`);
  top += GROUP_TITLE_H;
  let column = 0, left = 0, rowHeight = 0;
  for (const screen of list) {
    const [width, height] = screen.size;
    if (column === (width > WIDE_FROM ? WIDE_COLUMNS : NARROW_COLUMNS)) { column = 0; left = 0; top += rowHeight + GAP; rowHeight = 0; }
    const holder = document.createElement("div");
    holder.className = "item";
    holder.id = `screen_${screen.file.replace(".html", "")}`;
    holder.style.cssText = `left:${left}px;top:${top}px;width:${width}px;height:${height}px`;
    holder.innerHTML = `<a class="caption" href="${screen.file}?annotate">${screen.title}</a>`;
    board.append(holder);
    pending.push(loadScreen(holder, screen.file));
    content.width = Math.max(content.width, left + width);
    left += width + GAP;
    rowHeight = Math.max(rowHeight, height);
    column++;
  }
  top += rowHeight + GAP * 2;
}
content.height = top;
if (!saved) scale = Math.min(FIT_MAX_SCALE, Math.max(MIN_SCALE, (document.documentElement.clientWidth - PAD_X * 2) / content.width));
apply();
if (saved) scrollTo(saved.scrollX, saved.scrollY);
await Promise.all(pending);
window.WIRE_ANNOTATE = true;
await import("./wire.js");

const zoomTo = (next, clientX = innerWidth / 2, clientY = innerHeight / 2) => {
  const anchorX = (scrollX + clientX - PAD_X) / scale;
  const anchorY = (scrollY + clientY - PAD_Y) / scale;
  scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, next));
  apply();
  scrollTo(PAD_X + anchorX * scale - clientX, PAD_Y + anchorY * scale - clientY);
  zoomLabel.value = `${Math.round(scale * 100)}%`;
  remember();
};

const zoom = document.createElement("div");
zoom.className = "zoom";
zoom.innerHTML = '<button type="button" data-step="0.8" aria-label="Уменьшить">−</button><output></output><button type="button" data-step="1.25" aria-label="Увеличить">+</button><button type="button" data-fit>По ширине</button>';
const zoomLabel = zoom.querySelector("output");
zoomLabel.value = `${Math.round(scale * 100)}%`;
zoom.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.fit !== undefined) {
    zoomTo(Math.min(FIT_MAX_SCALE, Math.max(MIN_SCALE, (document.documentElement.clientWidth - PAD_X * 2) / content.width)), 0, 0);
    scrollTo(0, 0);
  } else zoomTo(scale * Number(button.dataset.step));
});
document.body.append(zoom);

let spaceHeld = false;
let drag = null;
const typing = (element) => element.closest("input, textarea, [contenteditable]");
addEventListener("keydown", (event) => {
  if (event.code !== "Space" || typing(event.target)) return;
  event.preventDefault();
  spaceHeld = true;
  document.documentElement.classList.add("panning");
});
addEventListener("keyup", (event) => {
  if (event.code !== "Space") return;
  spaceHeld = false;
  document.documentElement.classList.remove("panning");
});
addEventListener("mousedown", (event) => {
  if (!(spaceHeld && event.button === 0) && event.button !== 1) return;
  event.preventDefault();
  event.stopPropagation();
  drag = { x: event.clientX, y: event.clientY };
  document.documentElement.classList.add("dragging");
}, true);
addEventListener("mousemove", (event) => {
  if (!drag) return;
  scrollBy(drag.x - event.clientX, drag.y - event.clientY);
  drag = { x: event.clientX, y: event.clientY };
});
addEventListener("mouseup", () => {
  drag = null;
  document.documentElement.classList.remove("dragging");
});
addEventListener("click", (event) => {
  if (spaceHeld) { event.preventDefault(); event.stopPropagation(); }
}, true);

addEventListener("scroll", remember);
addEventListener("wheel", (event) => {
  if (!(event.ctrlKey || event.metaKey)) return;
  event.preventDefault();
  zoomTo(scale * Math.exp(-event.deltaY * 0.01), event.clientX, event.clientY);
}, { passive: false });
</script>
